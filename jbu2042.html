<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JBU 2042 — Japan Baseball Union 公式データベース</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   JBU 2042 — Design Tokens（ダークモード × ネオングリーン / ゴールド）
   ============================================================ */
:root {
  --bg:#070a09; --bg-2:#0c1110; --surface:#111816; --surface-2:#182220;
  --border:#243230; --text:#e8efec; --muted:#8a9a95;
  --accent:#2fff9a; --accent-dim:#1fae6a; --gold:#f5c542; --gold-dim:#b88a1f;
  --al:#38bdf8; --nl:#f472b6;
  --radius:12px; --shadow:0 10px 30px rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(47,255,154,.07), transparent 60%),
    radial-gradient(900px 500px at 0% 0%, rgba(245,197,66,.05), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  -webkit-font-smoothing: antialiased; letter-spacing:.01em;
}
a { color: inherit; text-decoration: none; }
.mono { font-variant-numeric: tabular-nums; }
.display { font-family: 'Oswald', 'Inter', sans-serif; letter-spacing:.04em; }

.shell { max-width:1200px; margin:0 auto; padding:0 20px 80px; }
.kicker { font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); }
.section-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:22px; letter-spacing:.02em; margin:2px 0 0; }
.section-head { margin:38px 0 16px; }
.muted { color: var(--muted); }
.grid { display:grid; gap:16px; }
@media (min-width:880px){ .g2 { grid-template-columns:1fr 1fr; } }
@media (min-width:980px){ .g3 { grid-template-columns:repeat(3,1fr); } }

/* ---- ヘッダー / ナビ ---- */
.topbar { position:sticky; top:0; z-index:50; background:rgba(7,10,9,.82); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
.topbar-inner { max-width:1200px; margin:0 auto; padding:0 20px; display:flex; align-items:center; gap:26px; height:64px; }
.brand { display:flex; align-items:center; gap:12px; cursor:pointer; }
.brand-mark { width:36px; height:36px; border-radius:9px; background:linear-gradient(135deg,var(--accent),var(--accent-dim)); display:grid; place-items:center; font-family:'Oswald'; font-weight:700; color:#04130b; font-size:18px; box-shadow:0 0 18px rgba(47,255,154,.35); }
.brand-name { font-family:'Oswald'; font-weight:700; font-size:18px; letter-spacing:.06em; }
.brand-sub { font-size:10px; letter-spacing:.25em; color:var(--muted); }
.nav { display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; }
.nav button { background:none; border:none; color:var(--muted); cursor:pointer; font-family:'Oswald'; font-weight:600; font-size:13px; letter-spacing:.14em; text-transform:uppercase; padding:10px 14px; border-radius:8px; transition:color .15s,background .15s; position:relative; }
.nav button:hover { color:var(--text); }
.nav button.active { color:var(--accent); }
.nav button.active::after { content:""; position:absolute; left:14px; right:14px; bottom:2px; height:2px; background:var(--accent); border-radius:2px; box-shadow:0 0 10px var(--accent); }
.season-pill { font-family:'Oswald'; font-size:12px; letter-spacing:.12em; color:var(--gold); border:1px solid var(--gold-dim); padding:5px 10px; border-radius:999px; white-space:nowrap; }

/* ---- カード ---- */
.card { background:linear-gradient(180deg,var(--surface),var(--bg-2)); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.card-head { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; }
.card-body { padding:14px 16px; }

/* ---- バッジ ---- */
.badge { display:inline-flex; align-items:center; justify-content:center; min-width:36px; height:22px; padding:0 6px; border-radius:6px; font-family:'Oswald'; font-weight:700; font-size:11px; letter-spacing:.04em; color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }

/* ---- ニューススライダー ---- */
.hero { position:relative; border-radius:var(--radius); overflow:hidden; min-height:380px; border:1px solid var(--border); display:flex; align-items:flex-end; }
.hero-bg { position:absolute; inset:0; }
.hero-grad { position:absolute; inset:0; background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.85) 95%); }
.hero-content { position:relative; padding:28px; max-width:720px; }
.hero-cat { display:inline-block; font-family:'Oswald'; font-size:11px; letter-spacing:.2em; text-transform:uppercase; background:var(--accent); color:#04130b; padding:4px 10px; border-radius:6px; margin-bottom:12px; font-weight:700; }
.hero-title { font-family:'Oswald'; font-weight:700; font-size:30px; line-height:1.15; margin:0 0 8px; }
.hero-excerpt { color:#cdd8d4; font-size:14px; max-width:600px; }
.hero-dots { position:absolute; right:22px; bottom:22px; display:flex; gap:8px; z-index:3; }
.hero-dot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.3); border:none; cursor:pointer; transition:all .2s; }
.hero-dot.active { background:var(--accent); width:22px; border-radius:5px; }
.hero-arrows button { position:absolute; top:50%; transform:translateY(-50%); z-index:3; width:40px; height:40px; border-radius:50%; cursor:pointer; background:rgba(0,0,0,.5); border:1px solid var(--border); color:#fff; font-size:18px; }
.hero-arrows .prev { left:16px; } .hero-arrows .next { right:16px; }

/* ---- サブ記事 ---- */
.sub-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer; transition:background .15s; }
.sub-item:last-child { border-bottom:none; }
.sub-item:hover { background:rgba(255,255,255,.02); }
.sub-thumb { width:64px; height:48px; border-radius:8px; flex:none; }
.sub-cat { font-family:'Oswald'; font-size:10px; letter-spacing:.16em; color:var(--gold); text-transform:uppercase; }
.sub-title { font-size:13px; font-weight:600; margin:2px 0; line-height:1.4; }
.sub-date { font-size:11px; color:var(--muted); }

/* ---- テーブル ---- */
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { text-align:left; font-family:'Oswald'; font-weight:600; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); padding:8px 10px; background:var(--surface-2); }
tbody td { padding:9px 10px; border-top:1px solid var(--border); }
tbody tr:hover { background:rgba(255,255,255,.02); }
.num { text-align:right; font-variant-numeric:tabular-nums; }
.rank-cell { font-family:'Oswald'; color:var(--muted); width:26px; }
.clinch { color:var(--accent); font-weight:700; }

/* ---- 投票系アワード ---- */
.award-block { margin-bottom:26px; }
.award-name { font-family:'Oswald'; font-weight:700; font-size:18px; letter-spacing:.04em; }
.podium { display:grid; gap:12px; }
@media (min-width:760px){ .podium { grid-template-columns:repeat(3,1fr); align-items:stretch; } }
.finalist { border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:16px; position:relative; overflow:hidden; }
.finalist.first { border-color:var(--gold-dim); background:linear-gradient(180deg,rgba(245,197,66,.10),var(--surface)); }
.finalist .place { font-family:'Oswald'; font-weight:700; font-size:12px; letter-spacing:.16em; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.finalist.first .place { color:var(--gold); }
.medal { font-size:16px; }
.finalist .player { font-family:'Oswald'; font-weight:700; font-size:19px; margin:4px 0; }
.finalist .stats { font-size:12px; color:var(--muted); line-height:1.6; }
.points-row { display:flex; align-items:baseline; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
.points-val { font-family:'Oswald'; font-weight:700; font-size:22px; color:var(--accent); }
.finalist.first .points-val { color:var(--gold); }
.points-label { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

/* ---- トグル / サブタブ ---- */
.toggle { display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:3px; }
.toggle button { border:none; background:none; cursor:pointer; color:var(--muted); font-family:'Oswald'; font-weight:600; font-size:12px; letter-spacing:.1em; padding:6px 14px; border-radius:6px; transition:all .15s; }
.toggle button.on.al { background:var(--al); color:#04212e; }
.toggle button.on.nl { background:var(--nl); color:#2e0418; }
.toggle button.on.acc { background:var(--accent); color:#04130b; }
.subtabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin:14px 0 18px; overflow-x:auto; }
.subtabs button { border:none; background:none; cursor:pointer; color:var(--muted); white-space:nowrap; font-family:'Oswald'; font-weight:600; font-size:13px; letter-spacing:.08em; padding:10px 14px; position:relative; }
.subtabs button.active { color:var(--accent); }
.subtabs button.active::after { content:""; position:absolute; left:14px; right:14px; bottom:-1px; height:2px; background:var(--accent); }

/* ---- フィールド図 ---- */
.field-wrap { position:relative; width:100%; max-width:620px; margin:0 auto; aspect-ratio:1/1; }
.field-pos { position:absolute; transform:translate(-50%,-50%); }
.field-card { display:flex; flex-direction:column; align-items:center; gap:3px; }
.field-card .pos-tag { font-family:'Oswald'; font-weight:700; font-size:10px; letter-spacing:.08em; padding:1px 6px; border-radius:4px; color:#04130b; }
.field-card .pos-body { background:rgba(7,10,9,.82); border:1px solid var(--border); border-radius:8px; padding:4px 7px; display:flex; align-items:center; gap:6px; backdrop-filter:blur(3px); box-shadow:0 4px 12px rgba(0,0,0,.4); }
.field-card .pos-name { font-size:11px; font-weight:700; white-space:nowrap; }
.field-card .pos-team { font-size:9px; color:var(--muted); white-space:nowrap; }

/* ---- ブラケット ---- */
.bracket { display:flex; gap:26px; overflow-x:auto; padding:6px 2px 16px; }
.round { display:flex; flex-direction:column; gap:16px; min-width:212px; justify-content:space-around; }
.round-label { font-family:'Oswald'; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
.matchup { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.mu-team { display:flex; align-items:center; gap:8px; padding:8px 10px; }
.mu-team + .mu-team { border-top:1px solid var(--border); }
.mu-team.win { background:rgba(47,255,154,.06); }
.mu-team .mu-seed { font-family:'Oswald'; font-size:10px; color:var(--muted); width:16px; }
.mu-team .mu-name { font-size:13px; font-weight:600; flex:1; }
.mu-team.win .mu-name { color:var(--accent); }
.mu-score { font-family:'Oswald'; font-weight:700; font-size:16px; }

/* ---- ワールドシリーズ（派手） ---- */
@keyframes wsGlow { 0%,100% { box-shadow:0 0 40px rgba(245,197,66,.25), inset 0 0 60px rgba(245,197,66,.06);} 50% { box-shadow:0 0 70px rgba(245,197,66,.45), inset 0 0 80px rgba(245,197,66,.10);} }
@keyframes shine { 0% { background-position:-200% center;} 100% { background-position:200% center;} }
.ws-champion {
  position:relative; border-radius:18px; overflow:hidden; text-align:center; padding:40px 24px 34px;
  border:1px solid var(--gold-dim);
  background:
    radial-gradient(700px 300px at 50% -10%, rgba(245,197,66,.22), transparent 70%),
    radial-gradient(500px 260px at 50% 120%, rgba(47,255,154,.10), transparent 70%),
    linear-gradient(180deg,#15110a,#0a0d0c);
  animation: wsGlow 4.5s ease-in-out infinite;
}
.ws-champion::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(115deg, transparent 0 22px, rgba(245,197,66,.03) 22px 23px); pointer-events:none; }
.ws-tag { font-family:'Oswald'; font-size:12px; letter-spacing:.42em; text-transform:uppercase; color:var(--gold); }
.ws-trophy { font-size:62px; line-height:1; margin:8px 0 4px; filter:drop-shadow(0 0 18px rgba(245,197,66,.5)); }
.ws-headline { font-family:'Oswald'; font-weight:700; font-size:18px; letter-spacing:.34em; text-transform:uppercase;
  background:linear-gradient(90deg,#b88a1f,#f5c542,#fff3c4,#f5c542,#b88a1f); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 4s linear infinite; }
.ws-champ-name { font-family:'Oswald'; font-weight:700; font-size:clamp(30px,6vw,52px); margin:6px 0 4px; color:#fff; text-shadow:0 0 26px rgba(245,197,66,.4); }
.ws-result { display:inline-flex; align-items:center; gap:16px; margin-top:10px; font-family:'Oswald'; }
.ws-result .vs-score { font-size:30px; font-weight:700; }
.ws-mvp { display:inline-flex; align-items:center; gap:10px; margin-top:18px; padding:8px 16px; border:1px solid var(--gold-dim); border-radius:999px; background:rgba(245,197,66,.08); }
.ws-mvp .lbl { font-family:'Oswald'; font-size:11px; letter-spacing:.2em; color:var(--gold); }
.ws-path { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:20px; }
.ws-path .step { font-size:11px; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:5px 12px; background:rgba(255,255,255,.02); }
.ws-path .step b { color:var(--text); }

/* ---- シリーズ詳細 ---- */
.series-card { border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); overflow:hidden; margin-bottom:14px; }
.series-card.major { border-color:var(--gold-dim); }
.series-head { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.series-round { font-family:'Oswald'; font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
.series-format { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:2px 9px; }
.series-line { display:flex; align-items:center; gap:14px; padding:12px 16px; flex-wrap:wrap; }
.series-team { display:flex; align-items:center; gap:8px; }
.series-team .nm { font-weight:700; }
.series-team.winner .nm { color:var(--accent); }
.series-vs { font-family:'Oswald'; font-weight:700; font-size:22px; }
.gamelog { display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 12px; }
.game-pill { display:flex; flex-direction:column; align-items:center; min-width:62px; border:1px solid var(--border); border-radius:8px; padding:5px 8px; background:var(--bg-2); }
.game-pill .gnum { font-size:9px; letter-spacing:.1em; color:var(--muted); }
.game-pill .gsc { font-family:'Oswald'; font-weight:700; font-size:14px; }
.series-note { padding:0 16px 14px; font-size:12.5px; color:#c4d0cc; line-height:1.7; }
.series-meta { padding:0 16px 14px; display:flex; gap:10px; flex-wrap:wrap; }
.meta-chip { font-size:11px; border:1px solid var(--border); border-radius:8px; padding:5px 10px; }
.meta-chip b { color:var(--accent); }
.meta-chip.mvp b { color:var(--gold); }

/* ---- 総括 ---- */
.recap { border:1px solid var(--border); border-radius:var(--radius); background:linear-gradient(180deg,var(--surface),var(--bg-2)); padding:22px; }
.recap h3 { font-family:'Oswald'; font-size:20px; margin:0 0 12px; }
.recap p { font-size:13.5px; line-height:1.85; color:#cdd8d4; margin:0 0 12px; }
.moment { display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--border); }
.moment .mk { font-family:'Oswald'; color:var(--accent); font-weight:700; font-size:13px; white-space:nowrap; }
.moment .mt { font-weight:700; font-size:13px; margin-bottom:2px; }
.moment .mb { font-size:12.5px; color:var(--muted); line-height:1.7; }

/* ---- プロスペクト ---- */
.prospect { display:flex; align-items:center; gap:14px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface); margin-bottom:10px; }
.prospect .pr-rank { font-family:'Oswald'; font-weight:700; font-size:26px; color:var(--accent); width:42px; text-align:center; }
.pr-grade { font-family:'Oswald'; font-weight:700; font-size:15px; color:var(--gold); border:1px solid var(--gold-dim); border-radius:8px; padding:4px 8px; }
.tag { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); border:1px solid var(--border); padding:2px 7px; border-radius:999px; }

/* ---- 大型MVP ---- */
.mvp-hero { border:1px solid var(--border); border-radius:var(--radius); padding:22px; background:linear-gradient(135deg,rgba(47,255,154,.08),var(--surface)); position:relative; overflow:hidden; }
.mvp-hero .label { font-family:'Oswald'; font-size:12px; letter-spacing:.2em; color:var(--accent); }
.mvp-hero .player { font-family:'Oswald'; font-weight:700; font-size:30px; margin:6px 0; }
.mvp-hero .line { color:var(--muted); font-size:13px; }

/* ---- フォトギャラリー（最大10枠） ---- */
.gallery-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
@media (min-width:680px){ .gallery-grid { grid-template-columns:repeat(3,1fr); } }
@media (min-width:980px){ .gallery-grid { grid-template-columns:repeat(5,1fr); } }
.photo-slot { position:relative; aspect-ratio:4/3; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--surface); display:block; }
.photo-slot.empty { border-style:dashed; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted); }
.photo-slot.empty:hover { border-color:var(--accent); color:var(--accent); }
.photo-slot img { width:100%; height:100%; object-fit:cover; display:block; }
.photo-num { font-family:'Oswald'; font-weight:700; font-size:22px; opacity:.45; }
.photo-cap { position:absolute; left:0; right:0; bottom:0; padding:7px 9px; font-size:11px; line-height:1.4; background:linear-gradient(transparent,rgba(0,0,0,.85)); }

.footer { text-align:center; color:var(--muted); font-size:12px; margin-top:60px; padding-top:24px; border-top:1px solid var(--border); }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel（プロトタイプ用 CDN。オフライン環境では動作しません） -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ============================================================================
 *  DATA — モックデータ（ここを書き換えるだけでサイト全体が更新されます）
 *  JBU 2042 新レギュレーション: AL / NL 各3地区・全30チーム + ワールドシリーズ
 * ==========================================================================*/
const DATA = {
  season: 2042,
  regulationNote: "2042シーズンより JBU は AL / NL 各3地区・全30球団制へ移行。王者はワールドシリーズで決定します。",

  /* --- 全30球団（バッジ色・略称・地区の参照元） --- */
  teams: {
    // American League — East
    SAI:{ name:"埼玉サンダース",            abbr:"SAI", league:"AL", div:"East",    color:"#f59e0b" },
    EHM:{ name:"愛媛オレンジカウンティ",    abbr:"EHM", league:"AL", div:"East",    color:"#ea580c" },
    HIR:{ name:"広島セントラルレイカーズ",  abbr:"HIR", league:"AL", div:"East",    color:"#7c3aed" },
    MCD:{ name:"町田アイアンテイルズ",      abbr:"MCD", league:"AL", div:"East",    color:"#64748b" },
    TKB:{ name:"筑波ギャラクシー",          abbr:"TKB", league:"AL", div:"East",    color:"#4338ca" },
    // American League — Central
    TOK:{ name:"東京ロイヤルファミリー",    abbr:"TOK", league:"AL", div:"Central", color:"#dc2626" },
    NII:{ name:"新潟イプシロンズ",          abbr:"NII", league:"AL", div:"Central", color:"#0891b2" },
    CHB:{ name:"千葉ロックスターズ",        abbr:"CHB", league:"AL", div:"Central", color:"#db2777" },
    FUK:{ name:"福岡ロマンチックウォリアーズ",abbr:"FUK",league:"AL", div:"Central", color:"#e11d48" },
    KUM:{ name:"熊本ヴォルケーノ",          abbr:"KUM", league:"AL", div:"Central", color:"#b45309" },
    // American League — West
    AIC:{ name:"愛知プロミネンス",          abbr:"AIC", league:"AL", div:"West",    color:"#0d9488" },
    HOK:{ name:"北海道ノーザンダンサーズ",  abbr:"HOK", league:"AL", div:"West",    color:"#0284c7" },
    NAR:{ name:"奈良クラウンバックス",      abbr:"NAR", league:"AL", div:"West",    color:"#a16207" },
    NGR:{ name:"流山シーマリナーズ",        abbr:"NGR", league:"AL", div:"West",    color:"#0369a1" },

/* ============================================================================

 * ==========================================================================*/
const team = (abbr) => DATA.teams[abbr] || { name: abbr, abbr, color:"#555" };

function Badge({ abbr }) {
  if (!abbr) return null;
  const t = team(abbr);
  return <span className="badge" style={{ background: t.color }}>{t.abbr}</span>;
}
function TeamCell({ abbr, full }) {
  if (!abbr) return <span className="muted">—</span>;
  const t = team(abbr);
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:8 }}>
      <Badge abbr={abbr} /><span style={{ fontWeight:600 }}>{full ? t.name : t.abbr}</span>
    </span>
  );
}
function Player({ name, t }) {
  if (!name || name === "—") return <span className="muted">—</span>;
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:7, flexWrap:"wrap" }}>
      {t ? <Badge abbr={t} /> : null}
      <span style={{ fontWeight:600 }}>{name}</span>
      {t ? <span className="muted" style={{ fontSize:11 }}>{team(t).abbr}</span> : null}
    </span>
  );
}
function SectionHead({ kicker, title, right }) {
  return (
    <div className="section-head" style={{ display:"flex", alignItems:"flex-end", justifyContent:"space-between", gap:12, flexWrap:"wrap" }}>
      <div><div className="kicker">{kicker}</div><h2 className="section-title">{title}</h2></div>
      {right}

}
function LeagueToggle({ value, onChange }) {

  );
}

function NewsSlider() {
  const [i, setI] = useState(0);
  const items = DATA.news;
  const go = (d) => setI((p) => (p + d + items.length) % items.length);
  const a = items[i];
  return (
    <div className="hero">
      <div className="hero-bg" style={{ background: GRADS[a.grad % GRADS.length] }} />
      <div className="hero-grad" />
      <div className="hero-arrows"><button className="prev" onClick={() => go(-1)}>‹</button><button className="next" onClick={() => go(1)}>›</button></div>
      <div className="hero-content">
        <span className="hero-cat">{a.cat}</span>
        <h1 className="hero-title">{a.title}</h1>
        <p className="hero-excerpt">{a.excerpt}</p>

      <div className="hero-dots">{items.map((_, k) => <button key={k} className={"hero-dot" + (k === i ? " active" : "")} onClick={() => setI(k)} />)}</div>
    </div>
  );
}

function pct(w, l) { const d = w + l; return d ? (w / d).toFixed(3).replace(/^0/, "") : ".000"; }
function StandingsTable({ lg, div }) {
  const rows = DATA.standings[lg][div];
  return (
    <div className="card">
      <div className="card-head">
        <span className="kicker" style={{ color: lg === "AL" ? "var(--al)" : "var(--nl)" }}>{lg} · {div}</span>
        <span className="muted" style={{ fontSize:11 }}>{DIV_JP[div]}</span>
      </div>
      <table>
        <thead><tr><th>#</th><th>Team</th><th className="num">W</th><th className="num">L</th><th className="num">PCT</th><th className="num">GB</th><th className="num">STRK</th></tr></thead>
        <tbody>
          {rows.map((r, idx) => (
            <tr key={r.team}>
              <td className="rank-cell">{idx + 1}</td>
              <td>
                <TeamCell abbr={r.team} full />
                {r.clinch === "z" ? <span className="clinch" title="リーグ全体首位"> ◆z</span> :
                 r.clinch === "y" ? <span className="clinch" title="地区優勝"> ◆y</span> :
                 r.clinch === "w" ? <span style={{color:"var(--gold)"}} title="ワイルドカード"> ◇w</span> : null}
              </td>
              <td className="num mono">{r.w}</td><td className="num mono">{r.l}</td>
              <td className="num mono">{pct(r.w, r.l)}</td><td className="num mono muted">{r.gb}</td>
              <td className="num mono" style={{ color: r.strk[0] === "W" ? "var(--accent)" : "var(--muted)" }}>{r.strk}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}
function StandingsPage() {

function Matchup({ s }) {
  const aw = s.as > s.bs, bw = s.bs > s.as;
  return (
    <div className="matchup">
      <div className={"mu-team" + (aw ? " win" : "")}>
        {s.sa ? <span className="mu-seed">#{s.sa}</span> : null}
        <Badge abbr={s.a} /><span className="mu-name">{team(s.a).name}</span><span className="mu-score mono">{s.as}</span>
      </div>
      <div className={"mu-team" + (bw ? " win" : "")}>
        {s.sb ? <span className="mu-seed">#{s.sb}</span> : null}
        <Badge abbr={s.b} /><span className="mu-name">{team(s.b).name}</span><span className="mu-score mono">{s.bs}</span>
      </div>
    </div>
  );
}
function LeagueBracket({ lg }) {
  const ps = DATA.postseason[lg];
  const accent = lg === "AL" ? "var(--al)" : "var(--nl)";
  return (
    <div className="card">
      <div className="card-head"><span className="kicker" style={{ color: accent }}>{lg === "AL" ? "American League" : "National League"}</span></div>
      <div className="card-body">
        <div className="bracket">
          <div className="round"><div className="round-label">Wild Card</div>{ps.wildCard.map((m, i) => <Matchup key={i} s={m} />)}</div>
          <div className="round"><div className="round-label">Division Series</div>{ps.division.map((m, i) => <Matchup key={i} s={m} />)}</div>
          <div className="round"><div className="round-label">{lg} Championship</div><Matchup s={ps.lcs} /></div>

}

function GameLog({ s }) {
  return (
    <div className="gamelog">
      {s.games.map((g, i) => {
        const aw = g[0] > g[1];
        return (
          <div key={i} className="game-pill">

              <span style={{ color: aw ? "var(--accent)" : "var(--muted)" }}>{g[0]}</span>

/* セクション別の写真枠数（合計10枠） */
const PHOTO_GROUPS = { hero: 2, series: 5, recap: 3 };

function PhotoStrip({ group, min = 180, ratio = "4/3" }) {
  const count = PHOTO_GROUPS[group] || 0;
  const photos = (DATA.postseason.gallery && DATA.postseason.gallery[group]) || [];
  const slots = Array.from({ length: count }, (_, i) => photos[i] || null);
  return (
    <div className="gallery-grid" style={{ gridTemplateColumns: `repeat(auto-fit, minmax(${min}px, 1fr))` }}>
      {slots.map((p, i) =>
        p && p.url ? (
          <a key={i} className="photo-slot" style={{ aspectRatio: ratio }} href={p.url} target="_blank" rel="noreferrer">
            <img src={p.url} alt={p.caption || `${group} photo ${i + 1}`} loading="lazy" />
            {p.caption ? <div className="photo-cap">{p.caption}</div> : null}
          </a>
        ) : (
          <div key={i} className="photo-slot empty" style={{ aspectRatio: ratio }}>
            <span className="photo-num">{i + 1}</span>
            <span style={{ fontSize:10, letterSpacing:".12em" }}>📷 写真を追加</span>
          </div>
        )
      )}
    </div>
  );
}

      <PhotoStrip group="series" min={170} ratio="4/3" />

      {/* 4) 総括 */}
      <SectionHead kicker="Recap" title="ポストシーズン総括" />
      <PostseasonRecap />

      {/* 総括付近の写真（3枠） */}
      <div className="kicker" style={{ margin:"18px 0 10px" }}>Scene Gallery</div>
      <PhotoStrip group="recap" min={220} ratio="4/3" />
    </div>
  );
}

/* ============================================================================
 *  PROSPECTS
 * ==========================================================================*/
function ProspectsPage() {
  return (
    <div>
      <SectionHead kicker="Prospects" title="若手有望株ランキング" right={<span className="muted" style={{fontSize:11}}>FV = Future Value 評価</span>} />
      {DATA.prospects.map((p) => (
        <div className="prospect" key={p.rank}>
          <div className="pr-rank">{p.rank}</div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
              <span className="display" style={{ fontSize:17, fontWeight:700 }}>{p.name}</span>
              <Badge abbr={p.team} /><span className="tag">{p.pos}</span><span className="tag">{p.age}歳</span><span className="tag">ETA {p.eta}</span>
            </div>
            <div className="muted" style={{ fontSize:12.5, marginTop:6 }}>{p.note}</div>
          </div>
          <div className="pr-grade">{p.grade} FV</div>
        </div>
      ))}
    </div>
  );
}

/* ============================================================================
 *  AWARDS
 * ==========================================================================*/
const MEDALS = ["🥇", "🥈", "🥉"];
function VotingAward({ award, lg }) {
  return (
    <div className="award-block">
      <div style={{ display:"flex", alignItems:"baseline", gap:10, marginBottom:10 }}>
        <span className="award-name">{award.label}</span><span className="muted" style={{ fontSize:11, letterSpacing:".12em" }}>{lg}</span>
      </div>
      <div className="podium">
        {award[lg].map((f, i) => (
          <div key={i} className={"finalist" + (i === 0 ? " first" : "")}>
            <div className="place"><span className="medal">{MEDALS[i]}</span>{i + 1}位</div>
            <div className="player">{f.p}</div>
            <div style={{ marginBottom:6 }}><Badge abbr={f.t} /> <span className="muted" style={{ fontSize:12 }}>{team(f.t).name}</span></div>
            <div className="stats">{f.line}</div>
            <div className="points-row">
              <span className="points-val mono">{f.pts}</span><span className="points-label">得票ポイント</span>
              {f.first ? <span className="points-label" style={{ marginLeft:"auto" }}>1位票 {f.first}</span> : null}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
function VotingTab() {
  const [lg, setLg] = useState("AL");
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:16 }}><LeagueToggle value={lg} onChange={setLg} /></div>
      {DATA.awards.voting.map((a) => <VotingAward key={a.key} award={a} lg={lg} />)}
    </div>
  );
}
const FIELD_POS = [
  { key:"P",  x:50, y:58, c:"#2fff9a" }, { key:"C",  x:50, y:90, c:"#2fff9a" },
  { key:"1B", x:74, y:64, c:"#f5c542" }, { key:"2B", x:62, y:42, c:"#f5c542" },
  { key:"3B", x:26, y:64, c:"#f5c542" }, { key:"SS", x:38, y:42, c:"#f5c542" },
  { key:"LF", x:16, y:22, c:"#38bdf8" }, { key:"CF", x:50, y:12, c:"#38bdf8" },
  { key:"RF", x:84, y:22, c:"#38bdf8" }, { key:"DH", x:90, y:92, c:"#f472b6" },
];
function FieldSvg() {
  const base = (x, y, k) => <rect key={k} x={x-1.4} y={y-1.4} width="2.8" height="2.8" fill="#fff" fillOpacity="0.85" transform={`rotate(45 ${x} ${y})`} />;
  return (
    <svg viewBox="0 0 100 100" style={{ position:"absolute", inset:0, width:"100%", height:"100%" }} aria-hidden>
      <defs><radialGradient id="grass" cx="50%" cy="60%" r="70%"><stop offset="0%" stopColor="#1f4a2e"/><stop offset="100%" stopColor="#0d2a18"/></radialGradient></defs>
      <rect width="100" height="100" fill="#0a1410" />
      <path d="M 50 82 L 8 38 A 60 60 0 0 1 92 38 Z" fill="url(#grass)" />
      <path d="M 50 82 L 72 60 L 50 38 L 28 60 Z" fill="#73553a" />
      <path d="M 50 76 L 66 60 L 50 44 L 34 60 Z" fill="#1f4a2e" />
      <line x1="50" y1="82" x2="8" y2="40" stroke="#fff" strokeOpacity="0.5" strokeWidth="0.3" />
      <line x1="50" y1="82" x2="92" y2="40" stroke="#fff" strokeOpacity="0.5" strokeWidth="0.3" />
      {base(50,82,"h")}{base(72,60,"1")}{base(50,38,"2")}{base(28,60,"3")}
      <circle cx="50" cy="60" r="3.2" fill="#8a6845" /><circle cx="50" cy="60" r="0.8" fill="#fff" fillOpacity="0.7" />
    </svg>
  );
}
function FieldDiagram() {
  const [lg, setLg] = useState("AL");
  const [award, setAward] = useState("gg");
  const map = (award === "gg" ? DATA.awards.goldGlove : DATA.awards.silverSlugger)[lg];
  const other = (award === "gg" ? DATA.awards.silverSlugger : DATA.awards.goldGlove)[lg];
  return (
    <div className="card">
      <div className="card-head" style={{ flexWrap:"wrap" }}>
        <div>
          <div className="kicker" style={{ color: lg === "AL" ? "var(--al)" : "var(--nl)" }}>{lg} · Field View</div>
          <div className="display" style={{ fontWeight:700, fontSize:15 }}>{award === "gg" ? "ゴールドグラブ賞" : "シルバースラッガー賞"}</div>
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <LeagueToggle value={lg} onChange={setLg} />
          <div className="toggle">
            <button className={award === "gg" ? "on acc" : ""} onClick={() => setAward("gg")}>Gold Glove</button>
            <button className={award === "ss" ? "on acc" : ""} onClick={() => setAward("ss")}>Silver Slugger</button>
          </div>
        </div>
      </div>
      <div className="card-body">
        <div className="field-wrap">
          <FieldSvg />
          {FIELD_POS.map((pos) => {
            const row = map[pos.key];
            if (!row || row.p === "—") return null;
            const t = team(row.t);
            const dbl = other[pos.key] && other[pos.key].p === row.p && row.p !== "—";
            return (
              <div key={pos.key} className="field-pos" style={{ left: pos.x + "%", top: pos.y + "%" }}>
                <div className="field-card">
                  <span className="pos-tag" style={{ background: pos.c }}>{pos.key}</span>
                  <div className="pos-body" style={{ borderColor: t.color }}>
                    <Badge abbr={row.t} />
                    <div style={{ display:"flex", flexDirection:"column", lineHeight:1.1 }}>
                      <span className="pos-name">{row.p}</span><span className="pos-team">{t.abbr}</span>
                    </div>
                    {dbl ? <span style={{ color:"var(--gold)", fontSize:9, fontWeight:700 }} title="攻守両賞">★W</span> : null}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <p className="muted" style={{ fontSize:11, textAlign:"center", marginTop:10 }}>
          <span style={{ color:"var(--gold)", fontWeight:700 }}>★W</span> は同年に攻守（ゴールドグラブ＋シルバースラッガー）両賞を獲得した選手を示します。
        </p>
      </div>
    </div>
  );
}
function FieldingTab() { return <div><FieldDiagram /></div>; }
function LeaderCard({ title, rows }) {
  return (
    <div className="card">
      <div className="card-head"><span className="kicker">{title}</span></div>
      <table>
        <tbody>
          {rows.map((r, i) => (
            <tr key={i}>
              <td className="rank-cell">{i + 1}</td>
              <td><Player name={r[0]} t={r[1]} /></td>
              <td className="num mono" style={{ fontWeight:700, color: i === 0 ? "var(--accent)" : "var(--text)" }}>{r[2]}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}
function LeadersTab() {
  const [lg, setLg] = useState("AL");
  const d = DATA.awards.leaders[lg];
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:14 }}><LeagueToggle value={lg} onChange={setLg} /></div>
      <div className="kicker" style={{ marginBottom:10 }}>Batting · 打撃</div>
      <div className="grid g2" style={{ marginBottom:24 }}>{Object.entries(d.batting).map(([k, rows]) => <LeaderCard key={k} title={k} rows={rows} />)}</div>
      <div className="kicker" style={{ marginBottom:10 }}>Pitching · 投手</div>
      <div className="grid g2">{Object.entries(d.pitching).map(([k, rows]) => <LeaderCard key={k} title={k} rows={rows} />)}</div>
    </div>
  );
}
function PostseasonMvpTab() {
  const list = DATA.awards.postseasonMvp;
  return (
    <div>
      <div className="grid g2" style={{ marginBottom:16 }}>
        {list.filter((m) => !m.big).map((m) => (
          <div key={m.key} className="mvp-hero">
            <div className="label">{m.label}</div>
            <div className="player">{m.p}</div>
            <div style={{ marginBottom:6 }}><Badge abbr={m.t} /> <span className="muted" style={{ fontSize:12 }}>{team(m.t).name}</span></div>
            <div className="line">{m.line}</div>
          </div>
        ))}
      </div>
      {list.filter((m) => m.big).map((m) => (
        <div key={m.key} className="mvp-hero" style={{ background:"linear-gradient(135deg, rgba(245,197,66,.16), var(--surface))", borderColor:"var(--gold-dim)" }}>
          <div className="label" style={{ color:"var(--gold)" }}>🏆 {m.label}</div>
          <div className="player" style={{ fontSize:38 }}>{m.p}</div>
          <div style={{ marginBottom:8 }}><Badge abbr={m.t} /> <span className="muted">{team(m.t).name}</span></div>
          <div className="line" style={{ fontSize:14 }}>{m.line}</div>
        </div>
      ))}
    </div>
  );
}
const AWARD_TABS = [
  { id:"voting",   label:"投票系アワード" },
  { id:"fielding", label:"ゴールドグラブ / シルバースラッガー" },
  { id:"leaders",  label:"リーグリーダー" },
  { id:"psmvp",    label:"ポストシーズンMVP" },
];
function AwardsPage() {
  const [tab, setTab] = useState("voting");
  return (
    <div>
      <SectionHead kicker="Awards" title="タイトル・表彰一覧"
        right={<span className="muted" style={{ fontSize:12, maxWidth:320, textAlign:"right" }}>MLB The Show フランチャイズ準拠の表彰データ</span>} />
      <div className="subtabs">{AWARD_TABS.map((t) => <button key={t.id} className={tab === t.id ? "active" : ""} onClick={() => setTab(t.id)}>{t.label}</button>)}</div>
      {tab === "voting" && <VotingTab />}
      {tab === "fielding" && <FieldingTab />}
      {tab === "leaders" && <LeadersTab />}
      {tab === "psmvp" && <PostseasonMvpTab />}
    </div>
  );
}

/* ============================================================================
 *  APP SHELL
 * ==========================================================================*/
const NAV = [
  { id:"home",       label:"Home" },
  { id:"standings",  label:"Standings" },
  { id:"postseason", label:"Postseason" },
  { id:"prospects",  label:"Prospects" },
  { id:"awards",     label:"Awards" },
];
function App() {
  const [page, setPage] = useState("home");
  return (
    <div>
      <header className="topbar">
        <div className="topbar-inner">
          <div className="brand" onClick={() => setPage("home")}>
            <div className="brand-mark">J</div>
            <div><div className="brand-name">JBU</div><div className="brand-sub">JAPAN BASEBALL UNION</div></div>
          </div>
          <nav className="nav">{NAV.map((n) => <button key={n.id} className={page === n.id ? "active" : ""} onClick={() => setPage(n.id)}>{n.label}</button>)}</nav>
          <span className="season-pill">{DATA.season} SEASON</span>
        </div>
      </header>
      <main className="shell">
        {page === "home" && <HomePage go={setPage} />}
        {page === "standings" && <StandingsPage />}
        {page === "postseason" && <PostseasonPage />}
        {page === "prospects" && <ProspectsPage />}
        {page === "awards" && <AwardsPage />}
        <div className="footer">JBU 総合データベース · {DATA.season} シーズン（2042新レギュレーション）<br/>© Japan Baseball Union — プロトタイプ / モックデータ</div>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
