# NBA2K 管理 (Sveltia CMS / Decap互換設定) — アンカー展開済み(共有参照なし)
backend:
  name: github
  repo: remiotaishi0308-cpu/nba-database
  branch: main
  base_url: https://sveltia-cms-auth.remiotaishi0308.workers.dev
media_folder: public/images/articles
public_folder: /images/articles
publish_mode: simple
collections:
  - name: articles
    label: 記事
    label_singular: 記事
    description: テキスト入力＋画像アップで、サイトの各シーズン記事に反映されます。
    folder: src/content/articles
    create: true
    slug: '{{fields.id}}'
    extension: json
    format: json
    identifier_field: title
    summary: '{{title}}  —  {{date}}'
    sortable_fields:
      - date
      - season
      - category
      - title
    fields:
      - name: id
        label: ID（半角英数-）
        widget: string
        pattern:
          - ^[a-z0-9-]+$
          - 半角英小文字・数字・ハイフンのみ
      - name: title
        label: タイトル
        widget: string
      - name: date
        label: 公開日
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - name: season
        label: シーズン開始年(任意)
        hint: 空欄でOK。空なら日付から自動判定(7月開幕〜翌6月=そのシーズン)。例 2026-27シーズンは 2026 と入力。
        widget: number
        value_type: int
        required: false
        min: 2025
      - name: category
        label: カテゴリ
        widget: select
        options:
          - 特集
          - インタビュー
          - ニュース
        default: ニュース
      - name: tags
        label: タグ
        widget: list
        required: false
        default: []
      - name: thumbnailUrl
        label: サムネイル画像
        widget: image
        required: false
        choose_url: false
      - name: summary
        label: リード文
        widget: text
      - name: content
        label: 本文
        widget: markdown
        hint: 見出しは行頭に「■ 」。画像はドラッグ&ドロップ。
  - name: seasons
    label: シーズン
    label_singular: シーズン
    description: 1エントリ=1シーズン。リーグ構成・クラブ/ロゴ・順位表・ポストシーズン・表彰をまとめて編集します。
    folder: src/data/seasons
    create: true
    extension: json
    format: json
    slug: '{{fields.season}}'
    identifier_field: season
    summary: '{{season}} シーズン'
    sortable_fields:
      - season
    fields:
      - name: season
        label: シーズン開始年
        widget: number
        value_type: int
        hint: ファイル名になります（2026.json）。2026-27シーズンなら 2026
      - name: league
        label: リーグ構成
        widget: object
        collapsed: true
        hint: カンファレンス・ディビジョン・プレーオフ枠を増減すると、サイトの表示が自動で追従します
        fields:
          - name: name
            label: リーグ名
            widget: string
            required: false
          - name: gamesPerTeam
            label: 1クラブの試合数
            widget: number
            value_type: int
            required: false
            default: 82
          - name: regulationNote
            label: レギュレーション注記
            widget: text
            required: false
          - name: conferences
            label: カンファレンス
            widget: list
            summary: '{{fields.key}} {{fields.name}}'
            fields:
              - name: key
                label: キー（East/West など）
                widget: string
              - name: name
                label: 表示名
                widget: string
              - name: label
                label: 英字表記
                widget: string
                required: false
              - name: divisions
                label: ディビジョン
                widget: list
                required: false
                summary: '{{fields.key}} {{fields.name}}'
                fields:
                  - name: key
                    label: キー（Atlantic など）
                    widget: string
                  - name: name
                    label: 表示名
                    widget: string
          - name: playoff
            label: プレーオフ規定
            widget: object
            collapsed: true
            fields:
              - name: berths
                label: 出場枠（各カンファレンス）
                widget: number
                value_type: int
                default: 8
              - name: directBerths
                label: 本戦へ直接進出（上位何位まで）
                widget: number
                value_type: int
                default: 6
              - name: playInStart
                label: プレイイン開始順位
                widget: number
                value_type: int
                default: 7
              - name: playInEnd
                label: プレイイン終了順位
                widget: number
                value_type: int
                default: 10
              - name: seriesFormat
                label: シリーズ形式
                widget: string
                required: false
                default: 7戦4勝制
              - name: homeCourt
                label: 開催順
                widget: string
                required: false
                default: 2-2-1-1-1
              - name: note
                label: 注記
                widget: text
                required: false
              - name: rounds
                label: ラウンド構成
                widget: list
                summary: '{{fields.key}} {{fields.label}}'
                fields:
                  - name: key
                    label: キー（r1/semis/confFinals）
                    widget: string
                  - name: label
                    label: 表示名
                    widget: string
          - name: clinchMarks
            label: クリンチ記号
            widget: list
            required: false
            summary: '{{fields.key}} = {{fields.label}}'
            fields:
              - name: key
                label: 記号（z/x/pi）
                widget: string
              - name: label
                label: 意味
                widget: string
      - name: teams
        label: クラブ・ロゴ
        widget: list
        collapsed: true
        minimize_collapsed: true
        summary: '{{fields.abbr}} {{fields.name}}'
        fields:
          - name: abbr
            label: 略称（順位表と紐づくキー）
            widget: string
          - name: name
            label: クラブ名
            widget: string
          - name: conference
            label: カンファレンス
            widget: string
            hint: league のカンファレンス key と一致させる（East / West）
          - name: division
            label: ディビジョン
            widget: string
            required: false
            hint: league のディビジョン key と一致させる（Atlantic / Central / Pacific / Midwest）
          - name: city
            label: 本拠地
            widget: string
            required: false
          - name: coach
            label: 監督
            widget: string
            required: false
          - name: color
            label: 'カラー（例 #ae3f29）'
            widget: string
            required: false
            hint: 白文字のバッジに使うため、濃い色を推奨
          - name: logo
            label: ロゴ画像
            widget: image
            required: false
          - name: league
            label: （旧）リーグ欄
            widget: string
            required: false
            hint: 互換のため残しています。通常は編集不要
      - name: standings
        label: 順位表（カンファレンス別）
        widget: object
        hint: カンファレンスごとに勝率順で並べてください。表示順がそのまま順位になります
        fields:
          - name: East
            label: イースタン・カンファレンス
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.team}}  {{fields.w}}-{{fields.l}}'
            fields:
              - name: team
                label: クラブ略称
                widget: string
              - name: w
                label: 勝
                widget: number
                value_type: int
                default: 0
              - name: l
                label: 敗
                widget: number
                value_type: int
                default: 0
              - name: gb
                label: GB
                widget: string
                required: false
                default: '—'
              - name: conf
                label: カンファレンス内成績
                widget: string
                required: false
              - name: div
                label: ディビジョン内成績
                widget: string
                required: false
              - name: home
                label: ホーム
                widget: string
                required: false
              - name: away
                label: ロード
                widget: string
                required: false
              - name: l10
                label: 直近10試合
                widget: string
                required: false
              - name: strk
                label: 連勝連敗（W2 / L3）
                widget: string
                required: false
              - name: diff
                label: 得失点差（+10.6）
                widget: string
                required: false
              - name: clinch
                label: クリンチ（z / x / pi）
                widget: string
                required: false
          - name: West
            label: ウェスタン・カンファレンス
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.team}}  {{fields.w}}-{{fields.l}}'
            fields:
              - name: team
                label: クラブ略称
                widget: string
              - name: w
                label: 勝
                widget: number
                value_type: int
                default: 0
              - name: l
                label: 敗
                widget: number
                value_type: int
                default: 0
              - name: gb
                label: GB
                widget: string
                required: false
                default: '—'
              - name: conf
                label: カンファレンス内成績
                widget: string
                required: false
              - name: div
                label: ディビジョン内成績
                widget: string
                required: false
              - name: home
                label: ホーム
                widget: string
                required: false
              - name: away
                label: ロード
                widget: string
                required: false
              - name: l10
                label: 直近10試合
                widget: string
                required: false
              - name: strk
                label: 連勝連敗（W2 / L3）
                widget: string
                required: false
              - name: diff
                label: 得失点差（+10.6）
                widget: string
                required: false
              - name: clinch
                label: クリンチ（z / x / pi）
                widget: string
                required: false
      - name: postseason
        label: ポストシーズン（サイト側で管理）
        widget: hidden
      - name: awards
        label: 表彰（サイト側で管理）
        widget: hidden
      - name: teamStats
        label: 選手成績（サイト側で管理）
        widget: hidden
      - name: prospects
        label: 有望株（サイト側で管理）
        widget: hidden
