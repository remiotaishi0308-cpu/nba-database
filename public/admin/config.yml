# NBA2K 管理 (Sveltia CMS / Decap互換設定) — アンカー展開済み(共有参照なし)
backend:
  name: github
  repo: remiotaishi0308-cpu/nba-database
  branch: main
  base_url: https://sveltia-cms-auth.remiotaishi0308.workers.dev
media_folder: public/images/articles
public_folder: /images/articles
publish_mode: simple
collections:
  - name: articles
    label: 記事
    label_singular: 記事
    description: テキスト入力＋画像アップで、サイトの各シーズン記事に反映されます。
    folder: src/content/articles
    create: true
    slug: '{{fields.id}}'
    extension: json
    format: json
    identifier_field: title
    summary: '{{title}}  —  {{date}}'
    sortable_fields:
      - date
      - season
      - category
      - title
    fields:
      - name: id
        label: ID（半角英数-）
        widget: string
        pattern:
          - ^[a-z0-9-]+$
          - 半角英小文字・数字・ハイフンのみ
      - name: title
        label: タイトル
        widget: string
      - name: date
        label: 公開日
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - name: season
        label: シーズン(年)
        widget: number
        value_type: int
        min: 2025
      - name: category
        label: カテゴリ
        widget: select
        options:
          - 特集
          - インタビュー
          - ニュース
        default: ニュース
      - name: tags
        label: タグ
        widget: list
        required: false
        default: []
      - name: thumbnailUrl
        label: サムネイル画像
        widget: image
        required: false
        choose_url: false
      - name: summary
        label: リード文
        widget: text
      - name: content
        label: 本文
        widget: markdown
        hint: 見出しは行頭に「■ 」。画像はドラッグ&ドロップ。
  - name: seasons
    label: シーズン (MLB 2042〜)
    label_singular: シーズン
    description: 「New シーズン」または複製で新しい年を作成できます。1エントリ=1シーズン。順位表・チーム/ロゴ・ポストシーズン・タイトル・選手成績をまとめて編集。
    folder: src/data/seasons
    create: true
    extension: json
    format: json
    slug: '{{fields.season}}'
    identifier_field: season
    summary: '{{season}} シーズン'
    sortable_fields:
      - season
    fields:
      - name: season
        label: シーズン(年) 例2043
        widget: number
        value_type: int
        hint: ファイル名になります(2043.json)
      - name: regulationNote
        label: レギュレーション注記
        widget: string
        required: false
      - name: teams
        label: チーム・ロゴ
        widget: list
        summary: '{{fields.abbr}} {{fields.name}}'
        fields:
          - name: abbr
            label: 略称
            widget: string
          - name: name
            label: チーム名
            widget: string
          - name: league
            label: カンファレンス
            widget: select
            options:
              - East
              - West
          - name: div
            label: ディビジョン(任意)
            widget: string
            required: false
          - name: color
            label: 'カラー #f59e0b'
            widget: string
          - name: logo
            label: ロゴ画像
            widget: image
            required: false
          - name: seasonStats
            label: シーズン成績
            widget: object
            required: false
            fields:
              - name: avg
